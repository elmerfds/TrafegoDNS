name: v2 CI

on:
  pull_request:
    branches: [feat/v2-rewrite, main]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'
  push:
    branches: [feat/v2-rewrite]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-ci.yml'
  workflow_dispatch:

concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-test-results
          path: v2/test-results.xml

  web:
    name: Web UI (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v2/web/package-lock.json
      - run: npm ci
      - run: npm run build
